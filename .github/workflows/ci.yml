name: Validación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Valores de ejemplo: la compilación no necesita acceso a una base real.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar pnpm
        run: npm install --global pnpm@11.8.0
      - name: Instalar dependencias del lockfile
        run: pnpm install --frozen-lockfile
      - name: Auditar dependencias de producción y desarrollo
        run: pnpm run audit:deps
      - name: Revisar repositorio, lint, tipos y pruebas
        run: pnpm run check
      - name: Probar guardado de domicilios en PostgreSQL temporal
        run: python -B scripts/test-domicilio-rpc.py --pg-bin "$(pg_config --bindir)"
      - name: Compilar
        run: pnpm run build
